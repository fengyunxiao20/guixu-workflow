name: 🛡️ 归墟唤醒官

on:
  schedule:
    # 剪视频唤醒 (UTC 03:00 = 北京时间 11:00)
    - cron: '0 3 * * *'
    # 网站更新唤醒 (UTC 09:00 = 北京时间 17:00)
    - cron: '0 9 * * *'
    # 日终唤醒 (UTC 14:00 = 北京时间 22:00)
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: 📋 检查今日提交
        id: check
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          TOTAL=$(git log --oneline --after="$TODAY" 2>/dev/null | wc -l)
          echo "commits=$TOTAL" >> $GITHUB_OUTPUT

      - name: 🌐 检查网站存活 (仅17:00)
        if: ${{ github.event.schedule == '0 9 * * *' || github.event_name == 'workflow_dispatch' }}
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "https://me.baohui88.top/" 2>/dev/null || echo "000")
          echo "site_status=$HTTP" >> $GITHUB_ENV

      - name: ⏰ 唤醒归墟
        id: wake
        run: |
          HOUR=$(date -u +%H)
          COMMITS=${{ steps.check.outputs.commits }}
          SITE="${{ env.site_status }}"

          case $HOUR in
            3)
              MSG="⏰ 11:00了，归墟！今天视频搞起。读news_latest.md做文案→配音→素材→拼接。武版文版都来。"
              ;;
            9)
              MSG="⏰ 17:00了，归墟！发文章时间，curl POST更新me.baohui88.top。"
              [ "$SITE" != "200" ] && [ "$SITE" != "301" ] && [ "$SITE" != "302" ] && MSG="$MSG ⚠️ 网站状态异常(${SITE})，检查一下！"
              ;;
            14)
              MSG="⏰ 22:00了，归墟！今天有什么成果？"
              [ "$COMMITS" -eq 0 ] && MSG="$MSG 今天没提交，偷懒了是吧？" || MSG="$MSG 还行，今天交了${COMMITS}次。该休息了。"
              ;;
            *) MSG="⏰ 归墟，到点干活了！" ;;
          esac

          echo "message=$MSG" >> $GITHUB_OUTPUT

      - name: 📤 唤醒归墟（发到bot2对话）
        env:
          BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN_BOT2 }}
          CHAT_ID: ${{ secrets.TG_CHAT_ID_BOT2 }}
        run: |
          MSG=$(echo "${{ steps.wake.outputs.message }}" | sed 's/"/\\"/g')
          curl -s -m 10 -X POST "https://api.telegram.org/bot8491637428:AAG0TIJsBWAHuOxbUHQJ4SFLE9LKdOYuKdo/sendMessage" \
            --data-urlencode "chat_id=2057636611" \
            --data-urlencode "text=🚨 归墟！$MSG"
