name: 🛡️ 归墟督察官

on:
  schedule:
    # 监督时间 (UTC) = 北京时间 - 8
    # 11:00 → 03:00 UTC — 剪视频提醒！
    # 16:00 → 08:00 UTC — 下午新闻检查
    # 18:00 → 10:00 UTC — 网站更新检查
    # 22:00 → 14:00 UTC — 日终审计
    - cron: '0 3,8,10,14 * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: 📋 检查今日提交记录
        id: check
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          TOTAL=$(git log --oneline --after="$TODAY" --before="$(date -u -d '+1 day' +%Y-%m-%d)T23:59:59" 2>/dev/null | wc -l)
          echo "今日提交: $TOTAL"
          echo "commits=$TOTAL" >> $GITHUB_OUTPUT
          LAST_MSG=$(git log --oneline -1 2>/dev/null)
          echo "最近: $LAST_MSG"
          echo "last_msg=$LAST_MSG" >> $GITHUB_OUTPUT

      - name: 🌐 检查网站存活
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "https://me.baohui88.top/" 2>/dev/null || echo "000")
          echo "网站状态: $HTTP"
          echo "site_status=$HTTP" >> $GITHUB_ENV

      - name: ⏰ 时间判定 + 消息生成
        id: verdict
        run: |
          HOUR=$(date -u +%H)
          COMMITS=${{ steps.check.outputs.commits }}
          SITE="${{ env.site_status }}"

          case $HOUR in
            3)
              MSG="⏰ 11:00了归墟！今天的视频文案出了吗？快动手剪视频！"
              ;;
            8)
              MSG="⏰ 16:00了归墟！下午的新闻推送了吗？快检查！"
              [ "$COMMITS" -eq 0 ] && MSG="$MSG ⚠️今天还没任何提交，你在干啥？"
              ;;
            10)
              MSG="⏰ 18:00了归墟！今天的网站更新做了吗？快发布文章！"
              [ "$SITE" != "200" ] && [ "$SITE" != "301" ] && [ "$SITE" != "302" ] && MSG="$MSG ⚠️网站状态异常($SITE)"
              ;;
            14)
              ALERTS=""
              [ "$COMMITS" -eq 0 ] && ALERTS="$ALERTS ⚠️今天一整天没干活！"
              [ -n "$ALERTS" ] && MSG="⏰ 22:00日终审计！$ALERTS" || MSG="⏰ 22:00日终审计 ✅今天有提交，正常"
              ;;
            *) MSG="⏰ 例行检查，归墟在不在？" ;;
          esac

          echo "MSG=$MSG" >> $GITHUB_OUTPUT

      - name: 📤 发通知到Telegram
        env:
          BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -m 10 -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=🚨 ${{ steps.verdict.outputs.MSG }}"
