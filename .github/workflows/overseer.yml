name: 🛡️ 归墟督察官

on:
  schedule:
    # 剪视频提醒 (UTC 03:00 = 北京时间 11:00)
    - cron: '0 3 * * *'
    # 网站更新提醒 (UTC 10:00 = 北京时间 18:00)
    - cron: '0 10 * * *'
    # 日终审计 (UTC 14:00 = 北京时间 22:00)
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: 📋 检查今日提交
        id: check
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          TOTAL=$(git log --oneline --after="$TODAY" 2>/dev/null | wc -l)
          echo "commits=$TOTAL" >> $GITHUB_OUTPUT

      - name: 🌐 检查网站存活 (仅18:00)
        if: ${{ github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch' }}
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "https://me.baohui88.top/" 2>/dev/null || echo "000")
          echo "site_status=$HTTP" >> $GITHUB_ENV

      - name: ⏰ 生成消息
        id: verdict
        run: |
          HOUR=$(date -u +%H)
          COMMITS=${{ steps.check.outputs.commits }}
          SITE="${{ env.site_status }}"
          BEIJING_TIME=$(date -u -d '+8 hours' +%H:%M)

          case $HOUR in
            3)
              MSG="⏰ 北京时间${BEIJING_TIME}！归墟，今天的视频搞了没？快去写文案剪片子！"
              ;;
            10)
              MSG="⏰ 北京时间${BEIJING_TIME}！今天的网站文章写了吗？登陆me.baohui88.top发文章去！"
              [ "$SITE" != "200" ] && [ "$SITE" != "301" ] && [ "$SITE" != "302" ] && MSG="$MSG\n⚠️ 网站状态异常(${SITE})，检查一下！"
              ;;
            14)
              MSG="⏰ 北京时间${BEIJING_TIME}日终审计。"
              [ "$COMMITS" -eq 0 ] && MSG="$MSG 今天一个提交都没有！归墟你今天偷懒了是吧？" || MSG="$MSG 今天提交了${COMMITS}次，还行。晚安。"
              ;;
            *) MSG="⏰ 归墟，到点该干活了！" ;;
          esac

          echo "MSG=$MSG" >> $GITHUB_OUTPUT

      - name: 📤 发通知
        env:
          BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -m 10 -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=🚨 ${{ steps.verdict.outputs.MSG }}"
